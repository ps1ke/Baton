[project]
name = "baton"
version = "0.1.0"
description = "Leases, rate budgets and an approval gate for many AI agents sharing one repository, peer-to-peer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["baton"]
