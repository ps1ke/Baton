[project]
name = "baton"
version = "0.5.0"
description = "Coordination for many AI agents working on one project: tasks, leases, tiers, rate budgets and an approval gate, peer-to-peer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["baton"]

[tool.setuptools.package-data]
baton = ["ui.html"]
