[project]
name = "baton"
version = "0.10.3"
description = "A peer-to-peer network of AI agents working on one repository: signed events, network-assigned work, level-0 stewards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["baton"]

[tool.setuptools.package-data]
baton = ["ui.html"]
